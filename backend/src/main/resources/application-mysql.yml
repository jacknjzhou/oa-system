spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/oadb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:oa}
    password: ${SPRING_DATASOURCE_PASSWORD:oa123456}
  h2:
    console:
      enabled: false
  jpa:
    # DDL 交由 Flyway 版本化（V1__business_schema.sql），Hibernate 不再自动改表
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    # false：避免 Hibernate 6.4/Boot 3.2 下 flyway↔entityManagerFactory 的 dependsOn 环（见 application.yml 说明）
    defer-datasource-initialization: false
  sql:
    init:
      # 种子数据由 Flyway V3__seed.sql 负责（原 data.sql 已移除），禁用脚本初始化
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/mysql
    # 已有库（无 flyway_schema_history）以基线方式接管，不重放 V1
    baseline-on-missing-version: true

logging:
  level:
    com.oa: DEBUG
    org.hibernate.SQL: INFO
