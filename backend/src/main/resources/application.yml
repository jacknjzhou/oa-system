server:
  port: 8080

spring:
  application:
    name: oa-backend
  datasource:
    url: jdbc:h2:mem:oadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    # 必须为 false：true 时 Boot 把 EntityManagerFactory 也登记为"数据库初始化器"，
    # 与 flyway 互为 dependsOn 形成环（Hibernate 6.4 + Boot 3.2 组合下启动即失败）。
    defer-datasource-initialization: false
  sql:
    init:
      # 不再使用 data.sql 脚本播种：种子数据已版本化为 Flyway V3__seed.sql，
      # 顺序由 Flyway 保证（V1 建表 → V2 表 → V3 种子），两档 profile 行为一致。
      mode: never
  flyway:
    # 统一启用：H2 开发/测试与 MySQL 生产走同一套迁移（common 双库通用 + h2 方言专属）
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/common,classpath:db/migration/h2

flowable:
  # 启动时自动创建/更新引擎表结构（Flowable 自管 ACT_*/FLW_* 表）
  database-schema-update: true
  # 启用 Job 执行器：BPMN 定时器/异步续流节点生效
  async-executor-activate: true
  # 自动部署 classpath:/processes/ 下的 BPMN 文件
  process-definition-location-prefix: classpath*:/processes/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"
  history-level: audit

# JWT 密钥必须经环境变量注入（生产）；此处默认值仅供本地开发，
# 历史上曾硬编码进 Git 的密钥已作废，请勿复用。
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-0123456789abcdef}
  access-token-expiration: ${JWT_ACCESS_TTL:1800000}        # 30 minutes (ms)
  refresh-token-expiration: ${JWT_REFRESH_TTL:604800000}    # 7 days (ms)

# 生产加固：CORS 白名单（逗号分隔），生产在 compose 注入明确域名
oa:
  cors:
    allowed-origins: ${OA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

logging:
  level:
    com.oa: DEBUG
    org.hibernate.SQL: DEBUG
