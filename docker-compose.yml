services:
  mysql:
    image: mysql:8.0
    container_name: oa-mysql
    environment:
      MYSQL_DATABASE: oadb
      MYSQL_USER: oa
      MYSQL_PASSWORD: oa123456
      MYSQL_ROOT_PASSWORD: root123456
    ports:
      - "3306:3306"
    volumes:
      - oa-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "oa", "-poa123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/oadb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=oa
      - SPRING_DATASOURCE_PASSWORD=oa123456
      # JWT 密钥：生产部署必须通过 .env 覆盖（JWT_SECRET=<64位随机hex>）；此处默认值仅开发用
      - JWT_SECRET=${JWT_SECRET:-bc19bd42b500f349f36bc9f42b597924c46ed1f02bb184b456f4ccb31e40eafa}
      # CORS 白名单：生产填实际前端域名，如 https://oa.example.com
      - OA_CORS_ORIGINS=${OA_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  oa-mysql-data:
